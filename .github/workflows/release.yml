name: Release

on:
  push:
    tags:
      - "v*"

# Prevent two tag pushes from racing a duplicate PyPI publish/GitHub release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run full test suite
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read
      id-token: write # required for tokenless Codecov upload via OIDC

  integration:
    name: Run integration tests
    uses: $/.github/workflows/integration.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          pip-version: "26.2.2"

      - run: pip install build twine==7.0.0

      - name: Build package
        run: python -m build

      - name: Check built distribution
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/calendaring-jmap/
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          generated_notes=$(gh api "repos/$REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG_NAME" --jq .body)
          printf 'See the [change log](https://calendaring-jmap.readthedocs.io/en/stable/changelog.html) for the full, categorized list of changes in this release.\n\n%s\n' \
            "$generated_notes" > notes.md
          gh release create "$TAG_NAME" --notes-file notes.md
